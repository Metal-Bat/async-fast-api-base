[tools]
python = "3.14.7"
uv = "0.12.9"
ruff = "0.16.6"
ty = "0.0.78"
pre-commit = "4.6.2"
rtk = "0.47.0"
"pipx:graphifyy" = "0.9.53"
"pipx:commitizen" = "4.19.0"

[tasks.setup]
description = "Initial project setup"
run = """
uv sync
pre-commit install
pre-commit install --hook-type commit-msg
"""

[tasks.fmt]
description = "Format source code with Ruff"
run = "uv run ruff format ."

[tasks.fmt-check]
description = "Check formatting without changing files"
run = "uv run ruff format --check ."

[tasks.lint]
description = "Run Ruff linter"
run = "uv run ruff check ."

[tasks.lint-fix]
description = "Run Ruff linter and auto-fix issues"
run = "uv run ruff check . --fix"

[tasks.typecheck]
description = "Run static type checking"
run = "uv run ty check"

[tasks.docstrings]
description = "Require public symbol docstrings in the utilities package"
run = "uv run ruff check src/utils --select D101,D102,D103,D104"

[tasks.doctest]
description = "Validate utility docstrings and executable examples"
run = "uv run pytest tests/conftest.py src/utils --doctest-modules"

[tasks.test]
description = "Run test suite"
run = "uv run pytest"

[tasks.coverage]
description = "Run tests with coverage report"
run = """
uv run pytest \
  --cov=src \
  --cov-fail-under=80 \
  --cov-report=term-missing \
  --cov-report=html
"""

[tasks.flow-test]
description = "Run the complete purchase workflow against a fresh disposable local PostgreSQL database"
run = "uv run --env-file .envs/.backend python scripts/run_flow_test.py"

[tasks.graphify]
description = "Generate the project knowledge graph"
run = "graphify ."

[tasks.i18n-extract]
description = "Extract gettext messages from Python sources"
run = "uv run pybabel extract -F babel.cfg -o src/locales/messages.pot ."

[tasks.i18n-update]
description = "Merge extracted messages into every locale catalog"
run = "uv run pybabel update -i src/locales/messages.pot -d src/locales"

[tasks.i18n-compile]
description = "Compile gettext catalogs used by the application"
run = "uv run pybabel compile -d src/locales"

[tasks.rtk-gain]
description = "Show RTK token savings for this project"
run = "rtk gain"

[tasks.benchmark]
description = "Run benchmark suite"
run = "uv run pytest benchmarks/ --benchmark-only"

[tasks.security]
description = "Run security scanners"
run = """
uv run bandit -r src
uv run python scripts/check_secrets.py
"""

[tasks.lock-check]
description = "Verify pyproject and the committed dependency lock agree"
run = "uv lock --check"

[tasks.precommit-check]
description = "Run repository hooks against all tracked files"
run = "uv run pre-commit run --all-files"

[tasks.check]
description = "Run the complete local validation gate in a stable order"
run = """
set -e
mise run lock-check
mise run fmt-check
mise run lint
mise run docstrings
mise run typecheck
mise run security
mise run doctest
mise run test
mise run flow-test
mise run precommit-check
"""

[tasks.commit]
description = "Create conventional commit interactively"
run = "uv run cz commit"

[tasks.bump]
description = "Bump semantic version and generate changelog"
run = "uv run cz bump"

[tasks.migrate]
description = "Apply latest database migrations"
run = "docker compose run --rm backend alembic upgrade head"

[tasks.makemigrations]
description = "Generate new Alembic migration"
run = "docker compose run --rm backend alembic revision --autogenerate -m"

[tasks.db-current]
description = "Show current Alembic revision"
run = "docker compose run --rm backend alembic current"

[tasks.db-history]
description = "Show Alembic migration history"
run = "docker compose run --rm backend alembic history"

[tasks.up]
description = "Start all local containers"
run = "docker compose up"

[tasks.down]
description = "Stop all local containers"
run = "docker compose down"

[tasks.restart]
description = "Restart all local containers"
run = """
docker compose down
docker compose up -d
"""

[tasks.build]
description = "Build Docker containers"
run = "docker compose build"

[tasks.rebuild]
description = "Rebuild Docker containers without cache"
run = "docker compose build --no-cache"

[tasks.logs]
description = "Show Docker compose logs"
run = "docker compose logs -f"

[tasks.ps]
description = "List running Docker compose services"
run = "docker compose ps"

[tasks.shell]
description = "Open shell inside backend container"
run = "docker compose exec backend bash"

[tasks.backend]
description = "Run backend container interactively"
run = "docker compose run --rm backend bash"

[tasks.clean]
description = "Remove caches and temporary files"
run = """
find . -type d -name '__pycache__' -exec rm -rf {} +
find . -type d -name '.pytest_cache' -exec rm -rf {} +
find . -type d -name '.ruff_cache' -exec rm -rf {} +
find . -type d -name '.mypy_cache' -exec rm -rf {} +
"""

[tasks.reset]
description = "Full local environment reset"
run = """
docker compose down -v
docker compose up -d
"""
