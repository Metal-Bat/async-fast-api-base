[project]
name = "fast-api-sample"
version = "0.1.0"
description = "Versioned forms and workflow backend"
readme = "README.md"
requires-python = ">=3.14.7"
license = { file = "LICENSE" }
authors = [{ name = "erfan ehsany" }]
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "babel>=2.18.0",
    "celery>=5.6.3",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.142.4",
    "fastapi-admin>=1.0.4",
    "flower>=2.2.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    "opentelemetry-instrumentation-celery>=0.66b1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-logging>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.13.5,<2.14",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.15.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "pyjwt==2.15.1",
    "redis>=8.1.0",
    "rich>=15.0.0",
    # OpenTelemetry SQLAlchemy instrumentation currently requires SQLAlchemy <2.1.
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "sqlparse>=0.6.0",
    "sqlmodel>=0.0.48",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "polars>=2.0.0",
    "openpyxl>=3.1.5",
    "pyzipper>=0.4.0",
    "opentelemetry-instrumentation-redis>=0.66b1",
    "opentelemetry-instrumentation-botocore>=0.66b1",
    "jsonschema>=4.26,<5",
    "rfc3339-validator>=0.1.4",
    "pydantic-ai-slim[anthropic,cerebras,cohere,crusoe,google,groq,huggingface,mistral,openai,openrouter,snowflake,typesafe,zai]==2.54.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "commitizen>=4.19.2",
    "coverage>=7.16.2",
    "debugpy>=1.8.22",
    "detect-secrets>=1.5.0",
    "factory-boy>=3.3.3",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "pytest-sugar>=1.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]


# ==== alembic ====
[tool.alembic]
script_location = "%(here)s/src/migrations"
prepend_sys_path = [".", "src"]
timezone = "UTC"

[tool.alembic.loggers]
keys = "root,sqlalchemy,alembic"

[tool.alembic.handlers]
keys = "console"

[tool.alembic.formatters]
keys = "generic"

[tool.alembic.logger_root]
level = "WARN"
handlers = "console"

[tool.alembic.logger_sqlalchemy]
level = "WARN"
handlers = "console,generic"
qualname = "sqlalchemy.engine"

[tool.alembic.logger_alembic]
level = "INFO"
handlers = "console,generic"
qualname = "alembic"

[tool.alembic.handler_console]
class = "StreamHandler"
args = "(sys.stderr,)"
level = "NOTSET"
formatter = "generic"

[tool.alembic.formatter_generic]
format = "%(levelname)-5.5s [%(name)s] %(message)s"
datefmt = "%H:%M:%S"

# ==== ruff ====
[tool.ruff]
src = ["src"]
extend-exclude = [".agents", ".codex", "graphify-out"]
line-length = 100
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
"**/api/**/*.py" = ["B008"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

# ==== ty ====
[tool.ty.environment]
root = ["./src", "."]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
all = "warn"

[[tool.ty.overrides]]
include = ["src/**"]

[tool.ty.overrides.rules]
possibly-unresolved-reference = "error"

[tool.ty.terminal]
error-on-warning = true
output-format = "full"

# ==== pytest ====
[tool.pytest.ini_options]
pythonpath = "src"
minversion = "6.0"
python_files = ["tests.py", "test_*.py"]
# Upstream SDK deprecations on Python 3.14; keep all other warnings visible.
# Remove these exact filters when Cohere/google-genai ship compatible fixes.
filterwarnings = [
    "ignore:'asyncio\\.iscoroutinefunction' is deprecated and slated for removal in Python 3\\.16; use inspect\\.iscoroutinefunction\\(\\) instead:DeprecationWarning:cohere\\.client$",
    "ignore:'_UnionGenericAlias' is deprecated and slated for removal in Python 3\\.17:DeprecationWarning:google\\.genai\\.types$",
]
markers = [
    "integration: requires the Docker Compose infrastructure",
]

# ==== Coverage ====
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

# ==== commitizen ====
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
