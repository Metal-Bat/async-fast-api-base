volumes:
  sample_postgres_data: {}
  sample_pgadmin_data: {}
  sample_cache_data: {}
  sample_s3_data: {}
  sample_broker_data: {}

services:
  backend:
    build:
      context: .
      dockerfile: ./compose/backend/Dockerfile
    image: sample_backend
    container_name: sample_backend
    depends_on:
      postgres:
        condition: service_started
      cache:
        condition: service_healthy
      s3:
        condition: service_started
      broker:
        condition: service_started
      otel-collector:
        condition: service_started
    volumes:
      - ./src:/app/src/:z
      - ./logs:/app/logs:z
    env_file:
      - ./.envs/.backend
    environment:
      - OTEL_SERVICE_NAME=sample-api
    ports:
      - "8000:8000"
      - "5678:5678"
    stdin_open: true
    tty: true

    command: /start

  worker:
    build:
      context: .
      dockerfile: ./compose/backend/Dockerfile
    image: sample_backend
    container_name: sample_worker
    restart: unless-stopped
    stop_grace_period: 21m
    working_dir: /app/src
    command: /start-worker
    depends_on:
      postgres:
        condition: service_started
      cache:
        condition: service_healthy
      s3:
        condition: service_started
      broker:
        condition: service_started
      otel-collector:
        condition: service_started
    volumes:
      - ./src:/app/src/:z
    env_file:
      - ./.envs/.backend
    environment:
      - OTEL_SERVICE_NAME=sample-worker

  reporting-worker:
    build:
      context: .
      dockerfile: ./compose/backend/Dockerfile
    image: sample_backend
    container_name: sample_reporting_worker
    restart: unless-stopped
    stop_grace_period: 21m
    working_dir: /app/src
    command: /start-reporting-worker
    depends_on:
      postgres:
        condition: service_started
      cache:
        condition: service_healthy
      s3:
        condition: service_started
      broker:
        condition: service_started
      otel-collector:
        condition: service_started
    volumes:
      - ./src:/app/src/:z
    env_file:
      - ./.envs/.backend
    environment:
      - OTEL_SERVICE_NAME=sample-reporting-worker

  scheduler:
    build:
      context: .
      dockerfile: ./compose/backend/Dockerfile
    image: sample_backend
    container_name: sample_scheduler
    restart: unless-stopped
    stop_grace_period: 30s
    working_dir: /app/src
    command: /start-scheduler
    depends_on:
      postgres:
        condition: service_started
      cache:
        condition: service_healthy
      s3:
        condition: service_started
      broker:
        condition: service_started
      otel-collector:
        condition: service_started
    volumes:
      - ./src:/app/src/:z
    env_file:
      - ./.envs/.backend
    environment:
      - OTEL_SERVICE_NAME=sample-scheduler

  flower:
    build:
      context: .
      dockerfile: ./compose/backend/Dockerfile
    image: sample_backend
    container_name: sample_flower
    working_dir: /app/src
    command: /start-flower
    depends_on:
      - broker
      - worker
      - reporting-worker
    env_file:
      - ./.envs/.backend
    ports:
      - "5555:5555"
    attach: false

  broker:
    build:
      context: .
      dockerfile: ./compose/broker/Dockerfile
    image: sample_broker
    container_name: sample_broker
    volumes:
      - sample_broker_data:/var/lib/rabbitmq
    env_file:
      - ./.envs/.broker
    ports:
      - "5672:5672"
      - "15672:15672"
    attach: false

  postgres:
    build:
      context: .
      dockerfile: ./compose/postgres/Dockerfile
    image: sample_postgres
    container_name: sample_postgres
    volumes:
      - sample_postgres_data:/var/lib/postgresql
    env_file:
      - ./.envs/.postgres
    ports:
      - "5432:5432"
    attach: false

  pgadmin:
    build:
      context: .
      dockerfile: ./compose/pgadmin/Dockerfile
    image: sample_pgadmin
    container_name: sample_pgadmin
    ports:
      - 5050:80
    volumes:
      - sample_pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    env_file:
      - ./.envs/.pgadmin
    attach: false

  cache:
    build:
      context: .
      dockerfile: ./compose/cache/Dockerfile
    image: sample_cache
    container_name: sample_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$CACHE_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - sample_cache_data:/data
    env_file:
      - ./.envs/.cache
    attach: false

  s3:
    build:
      context: .
      dockerfile: ./compose/s3/Dockerfile
    image: sample_s3
    container_name: sample_s3
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - sample_s3_data:/data
    env_file:
      - ./.envs/.s3
    ports:
      - "9000:9000"
      - "9001:9001"
    attach: false

  jaeger:
    build:
      context: .
      dockerfile: ./compose/jaeger/Dockerfile
    image: sample_jaeger
    container_name: sample_jaeger
    ports:
      - "16686:16686"
    attach: false

  otel-collector:
    build:
      context: .
      dockerfile: ./compose/otel-collector/Dockerfile
    image: sample_otel_collector
    container_name: sample_otel_collector
    depends_on:
      - jaeger
      - postgres
      - cache
      - broker
    env_file:
      - ./.envs/.postgres
      - ./.envs/.cache
      - ./.envs/.broker
    command: ["--config", "/etc/otel-collector-config.yaml"]
    ports:
      - "8889:8889"
    attach: false
